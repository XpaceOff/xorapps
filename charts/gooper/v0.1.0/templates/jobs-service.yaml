{{- $fullName := include "gooper.fullname" . -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-jobs-cip
  labels:
    {{- include "gooper.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobs
spec:
  # Only the web server talks to the job API, so it stays a ClusterIP: it is
  # not reachable from outside the cluster and the ingress never routes it.
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.service.jobsPort }}
      targetPort: {{ .Values.service.jobsContainerPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "gooper.name" . }}-jobs
    app.kubernetes.io/instance: {{ .Release.Name }}
