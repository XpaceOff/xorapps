{{- $fullName := include "gooper.fullname" . -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-cip
  labels:
    {{- include "gooper.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.webContainerPort }}
      protocol: TCP
  selector:
    {{- include "gooper.selectorLabels" . | nindent 4 }}
