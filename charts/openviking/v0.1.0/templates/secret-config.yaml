{{- if eq .Values.secretSource "create" }}
{{- $fullName := include "openviking.fullname" . -}}
{{- if not .Values.envVars.openviking.rootApiKey }}{{ fail "Root API Key is required when Credentials Source is 'Enter values here'" }}{{- end }}
{{- if not .Values.envVars.openviking.openaiApiKey }}{{ fail "OpenAI API Key is required when Credentials Source is 'Enter values here'" }}{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
stringData:
  OPENVIKING_ROOT_API_KEY: {{ .Values.envVars.openviking.rootApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.envVars.openviking.openaiApiKey | quote }}
{{- end }}
