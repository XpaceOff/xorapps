{{- if .Values.secrets.enabled -}}
{{- /*
  Build the merged secret map:
    1. parse .Values.secrets.envFile (KEY=VALUE lines, `#` comments, blanks skipped)
    2. overlay .Values.secrets.env so explicit YAML keys win over pasted keys
*/ -}}
{{- $merged := dict -}}
{{- with .Values.secrets.envFile -}}
{{-   range $line := splitList "\n" . -}}
{{-     $t := trim $line -}}
{{-     if and $t (not (hasPrefix "#" $t)) -}}
{{-       $parts := regexSplit "=" $t 2 -}}
{{-       if eq (len $parts) 2 -}}
{{-         $k := trim (index $parts 0) -}}
{{-         $v := index $parts 1 -}}
{{-         if $k -}}
{{-           $_ := set $merged $k $v -}}
{{-         end -}}
{{-       end -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
{{- range $k, $v := .Values.secrets.env -}}
{{-   $_ := set $merged $k $v -}}
{{- end -}}
{{- if $merged -}}
{{- $fullName := include "simple-app.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-env
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $merged }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end -}}
{{- end }}
