{{- $fullName := include "simple-app.fullname" . -}}
{{- $nfsEnabled := and .Values.storage.nfs.hostname .Values.storage.nfs.path -}}
{{- $secretsOn := and .Values.secrets .Values.secrets.enabled -}}
{{- $hasInlineSecrets := and $secretsOn (or .Values.secrets.env .Values.secrets.envFile) -}}
{{- $hasExternalSecrets := and $secretsOn (or .Values.secrets.existingSecret .Values.secrets.envFromExisting) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "simple-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "simple-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:

      {{- if $nfsEnabled }}
      # Prepare the NFS subdirectory so the main container can write to it.
      initContainers:
        - name: prepare-nfs-dirs
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /scripts/init.sh /scripts-w/init.sh && chmod +x /scripts-w/init.sh && /bin/sh /scripts-w/init.sh '{{ $fullName }}'
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: /tmp_mount
            - name: vol-configs
              mountPath: /scripts/init.sh
              subPath: init.sh
              readOnly: false
            - name: vol-empty-tmp
              mountPath: /scripts-w
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if or $hasInlineSecrets $hasExternalSecrets }}
          envFrom:
            {{- if $hasInlineSecrets }}
            - secretRef:
                name: {{ $fullName }}-env
            {{- end }}
            {{- with .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.secrets.envFromExisting }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $nfsEnabled }}
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: {{ .Values.storage.mountPath }}
              subPath: {{ $fullName }}
          {{- end }}

      {{- if $nfsEnabled }}
      volumes:
        - name: vol-{{ $fullName }}-nfs
          nfs:
            server: {{ .Values.storage.nfs.hostname }}
            path: {{ .Values.storage.nfs.path }}
        - name: vol-configs
          configMap:
            name: {{ $fullName }}-configs
        - name: vol-empty-tmp
          emptyDir: {}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
