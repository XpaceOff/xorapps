{{- if .Values.ingress.forceHttps -}}
{{- $fullName := include "simple-app.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-tm-tohttps
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
