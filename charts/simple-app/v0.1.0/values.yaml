# Default values for simple-app.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Extra environment variables passed straight to the container (non-secret).
# List of { name, value } entries.
env: []
  # - name: SOME_VAR
  #   value: "some-value"

# Secret environment variables.
secrets:
  # Master toggle. When false, no Secret is rendered and no envFrom is added,
  # regardless of the fields below. Defaults to false for backward compat.
  enabled: false

  # Inline secrets as a YAML map. When non-empty, they are merged into the
  # chart-managed Secret `<fullname>-env` and mounted via envFrom.secretRef.
  env: {}
    # DB_PASSWORD: "hunter2"
    # API_KEY: "abc123"

  # Alternative to `env`: paste a KEY=VALUE .env-style block. Lines are
  # parsed and merged into the same `<fullname>-env` Secret. Blank lines
  # and lines starting with `#` are ignored. If a key appears in both
  # `env` and `envFile`, the value from `env` wins.
  envFile: ""
    # Example:
    #   DB_PASSWORD=hunter2
    #   # a comment
    #   API_KEY=abc123

  # Single existing Secret picked from the Rancher UI dropdown. Loaded via
  # envFrom.secretRef. Leave empty to skip.
  existingSecret: ""

  # YAML-only: additional existing Secrets in the release namespace. Each
  # is loaded with envFrom.secretRef. Use this when you need to reference
  # more than one out-of-band Secret.
  envFromExisting: []
    # - my-preexisting-secret

# Port the container listens on. Also the target port of the Service.
containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  tlsEnabled: false
  forceHttps: true
  issuer: ""
  annotations: {}
  hostUrl: ""
  hostPath: /
  hostPathType: ImplementationSpecific

storage:
  # When both nfs.hostname and nfs.path are set, the NFS share is mounted
  # into the container at `mountPath`, scoped by release name via subPath.
  nfs:
    hostname: ""
    path: ""
  # Where inside the container the NFS volume should be mounted.
  mountPath: /data

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
