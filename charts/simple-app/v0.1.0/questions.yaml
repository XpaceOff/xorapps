questions:

  #  ________________________________________________________
  # |_______________________ Ingress _______________________|
  - variable: ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    required: true
    group: "Gateway/Ingress"
    show_subquestion_if: true
    subquestions:
    - variable: ingress.hostUrl
      required: true
      description: "Hostname to connect to your app"
      type: hostname
      label: "Hostname"
    - variable: ingress.hostPath
      label: "Path"
      description: "Path prefix served by this ingress"
      type: string
      default: "/"
      required: false
    - variable: ingress.tlsEnabled
      label: "Enable TLS"
      type: boolean
      default: false
      required: true
    - variable: ingress.issuer
      required: false
      description: "Name of the cert-manager Issuer used to issue the certificate"
      type: string
      label: "Issuer"
      show_if: "ingress.tlsEnabled=true"
    - variable: ingress.forceHttps
      label: "Use HTTPS only"
      default: true
      required: true
      type: boolean
      description: "If enabled, all requests to http will be redirected to https"

  #  ________________________________________________________
  # |_______________________ Storage _______________________|
  - variable: storage.type
    label: "Storage Type"
    description: "Select 'None' to run without persistent storage"
    type: enum
    required: true
    default: "None"
    options:
      - None
      - NFS
    group: "Storage"
  - variable: storage.nfs.hostname
    label: "NFS Server's Hostname"
    description: "FQDN of the NFS server."
    type: string
    required: true
    group: "Storage"
    show_if: "storage.type=NFS"
  - variable: storage.nfs.path
    label: "NFS Server's Path"
    description: "Path on the NFS server exported to the cluster."
    type: string
    required: true
    group: "Storage"
    show_if: "storage.type=NFS"
  - variable: storage.mountPath
    label: "Container Mount Path"
    description: "Where the NFS volume should be mounted inside the container."
    type: string
    default: "/data"
    required: true
    group: "Storage"
    show_if: "storage.type=NFS"

  #  ________________________________________________________
  # |________________________ Image ________________________|
  - variable: image.repository
    label: "Image Repository"
    description: "Docker image repository (e.g. nginx, ghcr.io/org/app)"
    type: string
    required: true
    default: "nginx"
    group: "Container Images"
  - variable: image.tag
    label: "Image Tag"
    description: "Docker image tag / version"
    type: string
    required: true
    default: "latest"
    group: "Container Images"
  - variable: containerPort
    label: "Container Port"
    description: "Port the container listens on"
    type: int
    required: true
    default: 80
    group: "Container Images"
  - variable: service.port
    label: "Service Port"
    description: "Port exposed by the ClusterIP Service (Ingress will target this)"
    type: int
    required: true
    default: 80
    group: "Container Images"
