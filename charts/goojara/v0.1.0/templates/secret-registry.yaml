{{- if eq .Values.registry.source "create" -}}
{{- $fullName := include "goojara.fullname" . -}}
{{- if not .Values.registry.username }}
{{- fail "registry.username is required when registry.source is 'create'" }}
{{- end }}
{{- if not .Values.registry.token }}
{{- fail "registry.token is required when registry.source is 'create' - use a GitHub personal access token (classic) with the read:packages scope" }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ $fullName }}-registry
  labels:
    {{- include "goojara.labels" . | nindent 4 }}
stringData:
  # The imagePullSecret used by the pods to pull the images from ghcr.io.
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":%q,\"password\":%q,\"auth\":%q}}}" .Values.registry.username .Values.registry.token (printf "%s:%s" .Values.registry.username .Values.registry.token | b64enc) | quote }}
{{- end }}
