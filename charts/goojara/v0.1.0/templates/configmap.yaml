{{- $fullName := include "goojara.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-configs
  labels:
    {{- include "goojara.labels" . | nindent 4 }}
data:
  # The app configuration, mounted read-only at /app/config.docker.toml.
  config.docker.toml: |
    {{- $jobsApiUrl := .Values.config.jobsApiUrl | default (include "goojara.jobsApiUrl" .) -}}
    {{- if .Values.config.toml }}
    {{- .Values.config.toml | nindent 4 }}
    {{- else }}
    [jobs]
    api_url = {{ $jobsApiUrl | quote }}
    {{- end }}
  init.sh: {{ .Files.Get "files/init.sh" | quote }}
