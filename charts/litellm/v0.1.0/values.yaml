replicaCount: 1

# Turn off the shared UI_USERNAME/UI_PASSWORD (or master key) login.
# Create a regular admin account in the UI first, then set this to true.
disableEnvCredentialLogin: false

# Where the credentials come from:
#   create   - chart creates the Secret <release>-config from envVars / database.internal.password
#   existing - chart uses the Secret named in existingSecret and creates none
secretSource: create

# Name of an existing Secret in this namespace (used when secretSource=existing).
# Required keys: LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL
# Optional keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, POSTGRES_PASSWORD (internal DB only)
existingSecret: ""

image:
  repository: ghcr.io/berriai/litellm
  pullPolicy: IfNotPresent
  tag: "v1.106.4"

envVars:
  litellm:
    masterKey: ""
    saltKey: ""
    databaseUrl: "" # used when database.type=external: postgresql://user:pass@host:5432/dbname
    storeModelInDb: "True"
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    awsRegionName: us-east-1
    # Public URL for links in emails. Empty = derived from ingress.hostUrl when ingress is enabled.
    proxyBaseUrl: ""

database:
  # external: use envVars.litellm.databaseUrl
  # internal: deploy a Postgres 16 workload in this release (data on NFS)
  type: external
  internal:
    image: postgres:16
    user: litellm
    password: ""
    dbName: litellm
    service:
      port: 5432

service:
  type: ClusterIP
  port: 4000

storage:
  # None: ephemeral storage for the chart-managed Postgres. NFS: data kept on an NFS share.
  type: None
  nfs:
    hostname: ""
    path: ""
  mountPath: /var/lib/postgresql/data

ingress:
  enabled: false
  className: ""
  tlsEnabled: true
  forceHttps: true
  issuer: ""
  annotations: {}
  hostUrl: ""
  hostPath: /
  hostPathType: Prefix

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
