questions:

  #  ________________________________________________________
  # |_______________________ Ingress _______________________|
  - variable: ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    required: true
    group: "Gateway/Ingress"
    show_subquestion_if: true
    subquestions:
    - variable: ingress.hostUrl
      required: true
      description: "Hostname to connect to LiteLLM"
      type: hostname
      label: "Hostname"
      default: ""
    - variable: ingress.hostPath
      label: "Path"
      description: "Path prefix served by this ingress"
      type: string
      default: "/"
      required: false
    - variable: ingress.tlsEnabled
      label: "Enable TLS"
      type: boolean
      default: true
      required: true
    - variable: ingress.issuer
      required: false
      description: "Name of the cert-manager Issuer used to issue the certificate"
      type: string
      label: "Issuer"
      default: "letsencrypt-prod"
      show_if: "ingress.tlsEnabled=true"
    - variable: ingress.forceHttps
      label: "Use HTTPS only"
      default: true
      required: true
      type: boolean
      description: "If enabled, all requests to http will be redirected to https"

  - variable: envVars.litellm.proxyBaseUrl
    label: "Public URL (email links)"
    description: "Base URL used in links sent by email, e.g. https://litellm.example.com. Leave empty to use the ingress hostname."
    type: string
    required: false
    default: ""
    group: "Gateway/Ingress"

  #  ________________________________________________________
  # |_______________________ Security ______________________|
  - variable: secretSource
    label: "Credentials Source"
    description: "Create the credentials Secret from the fields below, or select an existing Secret in this namespace."
    type: enum
    required: true
    default: "create"
    group: "Security"
    options:
      - value: create
        label: "Enter values here"
      - value: existing
        label: "Use an existing Secret"

  - variable: existingSecret
    label: "Existing Secret"
    description: "Secret in this namespace with keys LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL (see README)."
    type: secret
    required: false
    default: ""
    group: "Security"
    show_if: "secretSource=existing"

  - variable: envVars.litellm.masterKey
    label: "Master Key"
    description: "LiteLLM master key for authentication."
    type: password
    required: false
    default: ""
    group: "Security"
    show_if: "secretSource=create"

  - variable: envVars.litellm.saltKey
    label: "Salt Key"
    description: "LiteLLM salt key. Do not change after first use."
    type: password
    required: false
    default: ""
    group: "Security"
    show_if: "secretSource=create"

  - variable: envVars.litellm.awsAccessKeyId
    label: "AWS Access Key ID"
    description: "Optional. For Bedrock models."
    type: string
    required: false
    default: ""
    group: "Security"
    show_if: "secretSource=create"

  - variable: envVars.litellm.awsSecretAccessKey
    label: "AWS Secret Access Key"
    description: "Optional. For Bedrock models."
    type: password
    required: false
    default: ""
    group: "Security"
    show_if: "secretSource=create"

  - variable: envVars.litellm.awsRegionName
    label: "AWS Region"
    description: ""
    type: string
    required: false
    default: "us-east-1"
    group: "Security"

  - variable: disableEnvCredentialLogin
    label: "Disable env credential login"
    description: "Turns off the shared UI_USERNAME/UI_PASSWORD (or master key) login. Create a regular admin account in the LiteLLM UI first, then enable this."
    type: boolean
    required: false
    default: false
    group: "Security"

  #  ________________________________________________________
  # |_______________________ Database ______________________|
  - variable: database.type
    label: "Database"
    description: "'Use an existing Postgres (URL)': the connection string comes from the Database URL field, or from DATABASE_URL in the existing Secret if you chose 'Use an existing Secret'. 'Deploy my own Postgres': a Postgres is created in this release; its password comes from the Postgres Password field or POSTGRES_PASSWORD in the existing Secret."
    type: enum
    required: true
    default: "external"
    group: "Database"
    options:
      - value: internal
        label: "Deploy my own Postgres"
      - value: external
        label: "Use an existing Postgres (URL)"

  - variable: envVars.litellm.databaseUrl
    label: "Database URL"
    description: "PostgreSQL connection string, e.g. postgresql://litellm:password@db:5432/litellm"
    type: string
    required: false
    default: ""
    group: "Database"
    show_if: "database.type=external&&secretSource=create"

  - variable: database.internal.user
    label: "Postgres User"
    type: string
    required: true
    default: "litellm"
    group: "Database"
    show_if: "database.type=internal"

  - variable: database.internal.password
    label: "Postgres Password"
    description: "Password for the chart-managed Postgres."
    type: password
    required: false
    default: ""
    group: "Database"
    show_if: "database.type=internal&&secretSource=create"

  - variable: database.internal.dbName
    label: "Postgres Database Name"
    type: string
    required: true
    default: "litellm"
    group: "Database"
    show_if: "database.type=internal"

  - variable: database.internal.image
    label: "Postgres Image"
    type: string
    required: false
    default: "postgres:16"
    group: "Database"
    show_if: "database.type=internal"

  - variable: envVars.litellm.storeModelInDb
    label: "Store Models In DB"
    description: "When on, models added in the LiteLLM web UI (or via the API) are saved in the database and survive restarts. When off, they are kept in memory only and are lost on restart. Models in the config file are always loaded. Requires a database."
    type: boolean
    required: false
    default: "True"
    group: "Database"

  - variable: storage.type
    label: "Storage Type"
    description: "Storage for the chart-managed Postgres data. 'None' uses ephemeral storage and data is lost when the pod is replaced."
    type: enum
    required: true
    default: "None"
    group: "Database"
    show_if: "database.type=internal"
    options:
      - None
      - NFS

  - variable: storage.nfs.hostname
    label: "NFS Server's Hostname"
    description: "FQDN or IP of the NFS server."
    type: string
    required: true
    default: ""
    group: "Database"
    show_if: "database.type=internal&&storage.type=NFS"

  - variable: storage.nfs.path
    label: "NFS Server's Path"
    description: "Path of an EXISTING, EXPORTED directory on the NFS server (e.g. /volume1/k8s). Do not add a release subfolder; the chart creates one with subPath."
    type: string
    required: true
    default: ""
    group: "Database"
    show_if: "database.type=internal&&storage.type=NFS"

  - variable: storage.mountPath
    label: "Container Path"
    description: "Where the storage is mounted in the Postgres container."
    type: string
    required: true
    default: "/var/lib/postgresql/data"
    group: "Database"
    show_if: "database.type=internal&&storage.type=NFS"

  #  ________________________________________________________
  # |________________________ Image ________________________|
  - variable: numWorkers
    label: "Number of Workers"
    description: "LiteLLM worker processes per pod. Keep at 1 unless Redis is enabled."
    type: int
    required: true
    default: 1
    group: "Container Images"

  - variable: redis.enabled
    label: "Use Redis"
    description: "Shared state for rate limits, budgets, and router state. Required when running more than one worker or replica."
    type: boolean
    required: false
    default: false
    group: "Redis"
    show_subquestion_if: true
    subquestions:
    - variable: redis.type
      label: "Redis"
      description: "'Use an existing Redis': connect to a Redis server you run. 'Deploy my own Redis': a Redis is created in this release (no persistence), reachable only by LiteLLM."
      type: enum
      required: true
      default: "external"
      options:
        - value: internal
          label: "Deploy my own Redis"
        - value: external
          label: "Use an existing Redis"
    - variable: redis.host
      label: "Redis Host"
      description: "Hostname or IP of the existing Redis server"
      type: string
      required: false
      default: ""
      show_if: "redis.type=external"
    - variable: redis.port
      label: "Redis Port"
      type: int
      required: false
      default: 6379
      show_if: "redis.type=external"
    - variable: redis.password
      label: "Redis Password"
      description: "Leave empty for no password. Ignored when using an existing Secret (put REDIS_PASSWORD in the Secret instead)."
      type: password
      required: false
      default: ""
      show_if: "secretSource=create"

  #  ________________________________________________________
  # |________________________ Image ________________________|
  - variable: image.repository
    label: "Image Repository"
    description: "Docker image repository"
    type: string
    required: true
    default: "docker.litellm.ai/berriai/litellm"
    group: "Container Images"

  - variable: image.tag
    label: "Image Tag"
    description: "LiteLLM version to deploy"
    type: string
    required: true
    default: "v1.106.4"
    group: "Container Images"

  - variable: image.pullPolicy
    label: "Pull Policy"
    type: enum
    required: false
    default: "IfNotPresent"
    group: "Container Images"
    options:
      - IfNotPresent
      - Always
