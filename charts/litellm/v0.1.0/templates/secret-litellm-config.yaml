{{- if eq .Values.secretSource "create" }}
{{- $fullName := include "litellm.fullname" . -}}
{{- $internal := eq .Values.database.type "internal" -}}
{{- if not .Values.envVars.litellm.masterKey }}{{ fail "Master Key is required when Credentials Source is 'Enter values here'" }}{{- end }}
{{- if not .Values.envVars.litellm.saltKey }}{{ fail "Salt Key is required when Credentials Source is 'Enter values here'" }}{{- end }}
{{- if and (not $internal) (not .Values.envVars.litellm.databaseUrl) }}{{ fail "Database URL is required when Database is 'Use an existing Postgres (URL)'" }}{{- end }}
{{- if and $internal (not .Values.database.internal.password) }}{{ fail "Postgres Password is required when Database is 'Deploy my own Postgres'" }}{{- end }}
{{- $dbUrl := .Values.envVars.litellm.databaseUrl -}}
{{- if $internal -}}
{{- $dbUrl = printf "postgresql://%s:%s@%s-db-cip:%v/%s" (.Values.database.internal.user | urlquery) (.Values.database.internal.password | urlquery) $fullName .Values.database.internal.service.port (.Values.database.internal.dbName | urlquery) -}}
{{- end -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
stringData:
  LITELLM_MASTER_KEY: {{ .Values.envVars.litellm.masterKey | quote }}
  LITELLM_SALT_KEY: {{ .Values.envVars.litellm.saltKey | quote }}
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- if .Values.envVars.litellm.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.envVars.litellm.awsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.envVars.litellm.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.envVars.litellm.awsSecretAccessKey | quote }}
  {{- end }}
  {{- if $internal }}
  POSTGRES_PASSWORD: {{ .Values.database.internal.password | quote }}
  {{- end }}
{{- end }}
