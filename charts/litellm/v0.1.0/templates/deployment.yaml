{{- $fullName := include "litellm.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "litellm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/app/config.yaml", "--detailed_debug"]

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          # /health requires the master key; the liveness/readiness endpoints are unauthenticated
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /health/liveliness
              port: http

          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path: /health/readiness
              port: http

          env:
            - name: LITELLM_MASTER_KEY
              value: {{ .Values.envVars.litellm.masterKey | quote }}
            - name: LITELLM_SALT_KEY
              value: {{ .Values.envVars.litellm.saltKey | quote }}
            - name: DATABASE_URL
              {{- if eq .Values.database.type "internal" }}
              value: {{ printf "postgresql://%s:%s@%s-db-cip:%v/%s" .Values.database.internal.user .Values.database.internal.password $fullName .Values.database.internal.service.port .Values.database.internal.dbName | quote }}
              {{- else }}
              value: {{ .Values.envVars.litellm.databaseUrl | quote }}
              {{- end }}
            - name: STORE_MODEL_IN_DB
              value: {{ .Values.envVars.litellm.storeModelInDb | quote }}
            {{- if .Values.envVars.litellm.awsAccessKeyId }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.envVars.litellm.awsAccessKeyId | quote }}
            {{- end }}
            {{- if .Values.envVars.litellm.awsSecretAccessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.envVars.litellm.awsSecretAccessKey | quote }}
            {{- end }}
            - name: AWS_REGION_NAME
              value: {{ .Values.envVars.litellm.awsRegionName | default "us-east-1" | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: vol-config-file
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true

      volumes:
        - name: vol-config-file
          secret:
            secretName: {{ $fullName }}-config

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
