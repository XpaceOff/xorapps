{{- if eq .Values.database.type "internal" }}
{{- $fullName := include "litellm.fullname" . -}}
{{- $nfs := eq .Values.storage.type "NFS" -}}
{{- $secretName := printf "%s-config" $fullName -}}
{{- if eq .Values.secretSource "existing" }}{{- $secretName = .Values.existingSecret -}}{{- end }}
{{- if and $nfs (not (and .Values.storage.nfs.hostname .Values.storage.nfs.path)) }}
{{- fail "Storage Type NFS requires the NFS Server's Hostname and Path" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-db
  labels:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fullName }}-db
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- if $nfs }}
      initContainers:
        # Create the per-release directory on the NFS share and give it to the postgres user (uid 999)
        - name: prepare-nfs-dirs
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - mkdir -p /tmp_mount/{{ $fullName }}/postgres && chown -R 999:999 /tmp_mount/{{ $fullName }}/postgres
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: /tmp_mount
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.database.internal.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.internal.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.database.internal.dbName | quote }}
            # A subdirectory avoids initdb failing on the lost+found folder at the mount root
            - name: PGDATA
              value: {{ printf "%s/pgdata" (.Values.storage.mountPath | trimSuffix "/") | quote }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.internal.user | quote }}, "-d", {{ .Values.database.internal.dbName | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: vol-{{ $fullName }}-data
              mountPath: {{ .Values.storage.mountPath }}
              {{- if $nfs }}
              subPath: {{ $fullName }}/postgres
              {{- end }}
      volumes:
        - name: vol-{{ $fullName }}-data
          {{- if $nfs }}
          nfs:
            server: {{ .Values.storage.nfs.hostname }}
            path: {{ .Values.storage.nfs.path }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
