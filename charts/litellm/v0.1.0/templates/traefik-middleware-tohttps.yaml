{{- if and .Values.ingress.enabled .Values.ingress.forceHttps (ne .Values.ingress.exposure "internal") -}}
{{- $fullName := include "litellm.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-tm-tohttps
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
