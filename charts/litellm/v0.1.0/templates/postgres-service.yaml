{{- if eq .Values.database.type "internal" }}
{{- $fullName := include "litellm.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-db-cip
  labels:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.database.internal.service.port }}
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
