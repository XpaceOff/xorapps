{{- if .Values.ingress.enabled -}}
{{- $fullName := include "litellm.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $exposure := .Values.ingress.exposure -}}
{{- $internal := or (eq $exposure "internal") (eq $exposure "both") -}}
{{- if $internal -}}
{{- if not .Values.ingress.internalHostUrl -}}
{{- fail "ingress.internalHostUrl is required when ingress.exposure is 'internal' or 'both'" -}}
{{- end -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}-int-in
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.internalAllowedCidrs }}
  annotations:
    {{- if .Values.ingress.internalAllowedCidrs }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-tm-ipallowlist@kubernetescrd
    {{- end }}
  {{- range $key, $value := .Values.ingress.annotations }}
  {{- if $value }}
    {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.internalHostUrl | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hostPath }}
            pathType: {{ .Values.ingress.hostPathType }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}-cip
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}-cip
              servicePort: {{ $svcPort }}
              {{- end }}
{{- end -}}
{{- end -}}
