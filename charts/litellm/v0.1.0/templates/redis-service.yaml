{{- if and .Values.redis.enabled (eq .Values.redis.type "internal") }}
{{- $fullName := include "litellm.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-redis-cip
  labels:
    app.kubernetes.io/name: {{ $fullName }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $fullName }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
