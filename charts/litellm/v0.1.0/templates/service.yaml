{{- $fullName := include "litellm.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-cip
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 4000
      protocol: TCP
  selector:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
