{{- $fullName := include "litellm.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-configs
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get "files/config.yaml" | required "files/config.yaml missing" | nindent 4 }}
    general_settings:
      {{- if .Values.disableEnvCredentialLogin }}
      disable_env_credential_login: true
      {{- end }}
      {{- if .Values.generalSettings.forwardClientHeadersToLlmApi }}
      forward_client_headers_to_llm_api: true
      {{- end }}
