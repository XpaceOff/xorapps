{{- if and .Values.redis.enabled (eq .Values.redis.type "internal") }}
{{- $fullName := include "litellm.fullname" . -}}
# Only LiteLLM pods in this release may connect to the internal Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-redis-np
  labels:
    app.kubernetes.io/name: {{ $fullName }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "litellm.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
