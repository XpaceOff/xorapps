{{- $fullName := include "hindsight.fullname" . -}}
{{- $secretName := printf "%s-config" $fullName -}}
{{- if eq .Values.secretSource "existing" }}{{- $secretName = .Values.existingSecret -}}{{- end }}
{{- $nfs := eq .Values.storage.type "NFS" -}}
{{- if and $nfs (not (and .Values.storage.nfs.hostname .Values.storage.nfs.path)) }}
{{- fail "Storage Type NFS requires the NFS Server's Hostname and Path" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hindsight.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hindsight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hindsight.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false

      {{- if $nfs }}
      # Creates the release directory on the NFS share and fixes its
      # permissions, so the subPath mount in the main container can start.
      initContainers:
        - name: prepare-nfs-dirs
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /scripts/init.sh /scripts-w/init.sh && chmod +x /scripts-w/init.sh && /bin/sh /scripts-w/init.sh '{{ $fullName }}' 'pg0'
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: /tmp_mount
            - name: vol-configs
              mountPath: /scripts/init.sh
              subPath: init.sh
              readOnly: false
            - name: vol-empty-tmp
              mountPath: /scripts-w
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: control
              containerPort: 9999
              protocol: TCP

          # /health/live is in-process only (never touches the database), so a slow
          # or unreachable database does not restart the pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # /health verifies the database is reachable: a pod that cannot reach it
          # is taken out of the Service until it recovers.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            # Stable worker identity: must survive pod restarts, otherwise tasks
            # left in "processing" are never recovered.
            - name: HINDSIGHT_API_WORKER_ID
              value: {{ .Values.workerId | default $fullName | quote }}
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- if .Values.llm.baseUrl }}
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- end }}
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: HINDSIGHT_API_LLM_API_KEY
                  {{- if ne .Values.llm.provider "openai" }}
                  optional: true
                  {{- end }}
            - name: HINDSIGHT_API_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: {{ .Values.llm.maxConcurrent | toString | quote }}
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: {{ .Values.llm.timeout | toString | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if $nfs }}
            - name: vol-{{ $fullName }}-nfs
              mountPath: {{ .Values.storage.mountPath }}
              subPath: {{ $fullName }}/pg0
            {{- else }}
            - name: vol-{{ $fullName }}-data
              mountPath: {{ .Values.storage.mountPath }}
            {{- end }}
            # Hindsight uses shared memory; the compose file sets shm_size: 1g
            - name: vol-dshm
              mountPath: /dev/shm

      volumes:
        {{- if $nfs }}
        - name: vol-{{ $fullName }}-nfs
          nfs:
            server: {{ .Values.storage.nfs.hostname }}
            path: {{ .Values.storage.nfs.path }}
        - name: vol-configs
          configMap:
            name: {{ $fullName }}-configs
        - name: vol-empty-tmp
          emptyDir: {}
        {{- else }}
        - name: vol-{{ $fullName }}-data
          emptyDir: {}
        {{- end }}
        - name: vol-dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
