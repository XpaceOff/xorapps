{{- $fullName := include "hindsight.fullname" . -}}
{{- $secretName := printf "%s-config" $fullName -}}
{{- if eq .Values.secretSource "existing" }}{{- $secretName = .Values.existingSecret -}}{{- end }}
{{- $nfs := eq .Values.storage.type "NFS" -}}
{{- if and $nfs (not (and .Values.storage.nfs.hostname .Values.storage.nfs.path)) }}
{{- fail "Storage Type NFS requires the NFS Server's Hostname and Path" }}
{{- end }}
{{- if and $nfs (gt (int (.Values.replicaCount | default 1)) 1) }}
{{- fail "The embedded Postgres (pg0) is a single writer: replicaCount must be 1 when storage.type is NFS, otherwise multiple pods share one PostgreSQL data directory and shut each other down via postmaster.pid" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hindsight.labels" . | nindent 4 }}
spec:
  # pg0's data directory is shared via NFS. A rolling update would start the
  # replacement pod while the old one is still running, so two PostgreSQL
  # instances would fight over the same postmaster.pid - and each one shuts
  # the other down. Recreate terminates the old pod (database included) before
  # the replacement is created.
  strategy:
    type: Recreate
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hindsight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hindsight.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false

      # start-all.sh traps SIGTERM and shuts down gracefully: it drains in-flight
      # worker tasks (~45s worst case), then flushes pg0's WAL and checkpoints,
      # waiting up to 60s in total. The default 30s grace SIGKILLs the pod
      # mid-shutdown and leaves the embedded Postgres in "not properly shut
      # down" state with a stale postmaster.pid - the exact condition that
      # breaks the next startup. 90s covers the script's timeout with margin.
      terminationGracePeriodSeconds: 90

      {{- if $nfs }}
      # Creates the release directory on the NFS share and fixes its
      # permissions, so the subPath mount in the main container can start.
      initContainers:
        - name: prepare-nfs-dirs
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /scripts/init.sh /scripts-w/init.sh && chmod +x /scripts-w/init.sh && /bin/sh /scripts-w/init.sh '{{ $fullName }}' 'pg0'
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: /tmp_mount
            - name: vol-configs
              mountPath: /scripts/init.sh
              subPath: init.sh
              readOnly: false
            - name: vol-empty-tmp
              mountPath: /scripts-w
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: control
              containerPort: 9999
              protocol: TCP

          # Startup loads the embedding and reranker models and starts the embedded
          # Postgres before the HTTP port answers, which takes minutes on a cold start.
          # Liveness and readiness are held back until this probe succeeds.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # /health/live alone cannot catch the failure mode that matters here:
          # the embedded Postgres dying inside a still-running API process
          # (observed after an unclean pod termination). The pod then sits
          # not-ready forever, because only a pod restart brings the database
          # back. So liveness checks the database too: pg_isready (bundled by
          # the image under pg0/installation) plus the API health endpoint via
          # the image's own http_probe module. This deviates from the usual
          # "liveness must not touch the database" rule on purpose - here the
          # database lives in the pod, so restarting the pod is the only fix.
          # The startup probe above holds liveness back until first boot has
          # finished, so a slow model download never restarts the pod.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  cd /app/api;
                  PGBIN=$(ls -d {{ .Values.storage.mountPath }}/installation/*/bin 2>/dev/null | head -n 1);
                  PIDFILE=$(ls {{ .Values.storage.mountPath }}/instances/*/data/postmaster.pid 2>/dev/null | head -n 1);
                  PGPORT=$(sed -n '4p' "$PIDFILE" 2>/dev/null);
                  "$PGBIN/pg_isready" -q -h 127.0.0.1 -p "${PGPORT:-5432}"
                  && python3 -m hindsight_api.http_probe http://127.0.0.1:8888/health/live 5
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # /health verifies the database is reachable: a pod that cannot reach it
          # is taken out of the Service until it recovers.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            # Stable worker identity: must survive pod restarts, otherwise tasks
            # left in "processing" are never recovered.
            - name: HINDSIGHT_API_WORKER_ID
              value: {{ .Values.workerId | default $fullName | quote }}
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- if .Values.llm.baseUrl }}
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- end }}
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: HINDSIGHT_API_LLM_API_KEY
                  {{- if ne .Values.llm.provider "openai" }}
                  optional: true
                  {{- end }}
            - name: HINDSIGHT_API_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: {{ .Values.llm.maxConcurrent | toString | quote }}
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: {{ .Values.llm.timeout | toString | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if $nfs }}
            - name: vol-{{ $fullName }}-nfs
              mountPath: {{ .Values.storage.mountPath }}
              subPath: {{ $fullName }}/pg0
            {{- else }}
            - name: vol-{{ $fullName }}-data
              mountPath: {{ .Values.storage.mountPath }}
            {{- end }}
            # Hindsight uses shared memory; the compose file sets shm_size: 1g
            - name: vol-dshm
              mountPath: /dev/shm

      volumes:
        {{- if $nfs }}
        - name: vol-{{ $fullName }}-nfs
          nfs:
            server: {{ .Values.storage.nfs.hostname }}
            path: {{ .Values.storage.nfs.path }}
        - name: vol-configs
          configMap:
            name: {{ $fullName }}-configs
        - name: vol-empty-tmp
          emptyDir: {}
        {{- else }}
        - name: vol-{{ $fullName }}-data
          emptyDir: {}
        {{- end }}
        - name: vol-dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
