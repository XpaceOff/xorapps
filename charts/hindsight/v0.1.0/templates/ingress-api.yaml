{{- if and .Values.ingress.enabled .Values.ingress.api.enabled -}}
{{- $fullName := include "hindsight.fullname" . -}}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}-api-in
  labels:
    {{- include "hindsight.labels" . | nindent 4 }}
  annotations:
  {{- if .Values.ingress.issuer }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer }}
  {{- end }}
  {{- if .Values.ingress.forceHttps }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-tm-tohttps@kubernetescrd
  {{- end }}
  {{- range $key, $value := .Values.ingress.annotations }}
  {{- if $value }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
spec:
  {{- if and .Values.ingress.tlsEnabled .Values.ingress.issuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.hostUrl | quote }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.hostUrl | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hostPath }}
            pathType: {{ .Values.ingress.hostPathType }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}-cip
                port:
                  number: {{ .Values.service.port }}
              {{- else }}
              serviceName: {{ $fullName }}-cip
              servicePort: {{ .Values.service.port }}
              {{- end }}
{{- end }}
