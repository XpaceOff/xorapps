{{- if eq .Values.secretSource "create" }}
{{- $fullName := include "hindsight.fullname" . -}}
{{- if and (eq .Values.llm.provider "openai") (not .Values.llm.apiKey) }}
{{- fail "LLM API Key is required when LLM Provider is 'openai' and Credentials Source is 'Enter values here'" }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "hindsight.labels" . | nindent 4 }}
stringData:
  {{- if .Values.llm.apiKey }}
  HINDSIGHT_API_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
{{- end }}
