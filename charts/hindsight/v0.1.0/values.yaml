replicaCount: 1

image:
  repository: ghcr.io/vectorize-io/hindsight
  pullPolicy: IfNotPresent
  # Upstream releases: https://github.com/vectorize-io/hindsight/releases
  tag: "1.1.0"

# Where the credentials come from:
#   create   - chart creates the Secret <release>-config from llm.apiKey
#   existing - chart uses the Secret named in existingSecret and creates none
secretSource: create

# Existing Secret (secretSource=existing). Optional key: HINDSIGHT_API_LLM_API_KEY
existingSecret: ""

llm:
  # openai: any OpenAI-compatible endpoint (e.g. LiteLLM). ollama: local Ollama server.
  provider: openai
  baseUrl: "" # e.g. http://litellm.example.com:4000/v1 or http://ollama.example.com:11434/v1
  apiKey: ""
  model: ""
  maxConcurrent: 4
  timeout: 300

# Stable worker identity (HINDSIGHT_API_WORKER_ID). Hindsight warns when this
# changes between pod restarts: tasks left in "processing" under the old
# hostname are never recovered. Empty = the release name, which is stable.
# Only set it if you run more than one pod, and then make it unique per pod.
workerId: ""

service:
  type: ClusterIP
  # 8888 = Hindsight API, 9999 = Control Plane (web UI). Both are exposed by the Service.
  port: 8888
  controlPort: 9999

ingress:
  enabled: false
  className: ""
  # external: public hostname, TLS from cert-manager, redirect to HTTPS.
  # internal: hostname resolved only by the internal DNS (e.g. app.cluster).
  #           No public certificate is possible for such a name, so TLS and
  #           the HTTPS redirect are not rendered.
  exposure: external
  # Backend port for the main hostUrl: 9999 routes to the web UI.
  port: 9999
  tlsEnabled: true
  forceHttps: true
  issuer: ""
  annotations: {}
  hostUrl: ""
  hostPath: /
  hostPathType: Prefix
  # Optional second hostname that routes to the API (port 8888), e.g. api.hindsight.example.com.
  api:
    enabled: false
    hostUrl: ""

storage:
  # None: ephemeral storage. NFS: keep embedded Postgres data (pg0) on an NFS share.
  type: None
  nfs:
    hostname: ""
    path: ""
  # Where the data is mounted in the container (embedded Postgres data directory).
  mountPath: /home/hindsight/.pg0

serviceAccount:
  # This chart does not create a ServiceAccount resource.
  create: false
  name: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
