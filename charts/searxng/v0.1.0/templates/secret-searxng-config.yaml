{{- $sxng := dict -}}
{{- with .Values.searxng -}}
{{- if kindIs "map" . -}}
{{- $sxng = . -}}
{{- end -}}
{{- end -}}
{{- $formatsCfg := dict -}}
{{- if kindIs "map" $sxng.searchFormats -}}
{{- $formatsCfg = $sxng.searchFormats -}}
{{- end -}}
{{- $formatsExtra := or $formatsCfg.json $formatsCfg.csv $formatsCfg.rss -}}
{{- $contactCfg := dict -}}
{{- if kindIs "map" $sxng.contactUrl -}}
{{- $contactCfg = $sxng.contactUrl -}}
{{- end -}}
{{- $contactEnabled := default false $contactCfg.enabled -}}
{{- $contactEmail := default "" $contactCfg.email -}}
{{- $settingsYml := default "" $sxng.settingsYml -}}
{{- if and $contactEnabled (not $contactEmail) -}}
{{- fail "Contact email is required when 'Set a contact URL' is on" -}}
{{- end -}}
{{- if and (eq .Values.secretSource "existing") (not .Values.existingSecret) -}}
{{- fail "existingSecret is required when Credentials Source is 'Use an existing Secret'" -}}
{{- end -}}
{{- if and (eq .Values.secretSource "existing") $settingsYml -}}
{{- fail "searxng.settingsYml requires Credentials Source 'Enter value here': the chart writes the file into its own Secret, which it does not manage when an existing Secret is selected" -}}
{{- end -}}
{{- if and $settingsYml $formatsExtra -}}
{{- fail "searxng.searchFormats cannot be combined with searxng.settingsYml - set search.formats inside your settings.yml instead" -}}
{{- end -}}
{{- if eq .Values.secretSource "create" -}}
{{- $fullName := include "searxng.fullname" . -}}
{{- if not (default "" $sxng.secret) }}{{ fail "SearXNG Secret is required when Credentials Source is 'Enter value here'" }}{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
stringData:
  SEARXNG_SECRET: {{ default "" $sxng.secret | quote }}
  {{- if $settingsYml }}
  settings.yml: |
{{ $settingsYml | indent 4 }}
  {{- end }}
{{- end }}
