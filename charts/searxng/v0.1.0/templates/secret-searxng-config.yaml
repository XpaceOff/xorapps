{{- if and .Values.searxng.contactUrl.enabled (not .Values.searxng.contactUrl.email) -}}
{{- fail "Contact email is required when 'Set a contact URL' is on" -}}
{{- end -}}
{{- $formatsExtra := or .Values.searxng.searchFormats.json .Values.searxng.searchFormats.csv .Values.searxng.searchFormats.rss -}}
{{- if and (eq .Values.secretSource "existing") (not .Values.existingSecret) -}}
{{- fail "existingSecret is required when Credentials Source is 'Use an existing Secret'" -}}
{{- end -}}
{{- if and (eq .Values.secretSource "existing") $formatsExtra -}}
{{- fail "searxng.searchFormats requires Credentials Source 'Enter value here': the chart renders search.formats into its own settings.yml, which it does not manage when an existing Secret is selected" -}}
{{- end -}}
{{- if and (eq .Values.secretSource "existing") .Values.searxng.settingsYml -}}
{{- fail "searxng.settingsYml requires Credentials Source 'Enter value here': the chart writes the file into its own Secret, which it does not manage when an existing Secret is selected" -}}
{{- end -}}
{{- if and .Values.searxng.settingsYml $formatsExtra -}}
{{- fail "searxng.searchFormats cannot be combined with searxng.settingsYml - set search.formats inside your settings.yml instead" -}}
{{- end -}}
{{- if eq .Values.secretSource "create" -}}
{{- $fullName := include "searxng.fullname" . -}}
{{- if not .Values.searxng.secret }}{{ fail "SearXNG Secret is required when Credentials Source is 'Enter value here'" }}{{- end }}
{{- $formats := list "html" -}}
{{- if .Values.searxng.searchFormats.json }}{{- $formats = append $formats "json" }}{{- end }}
{{- if .Values.searxng.searchFormats.csv }}{{- $formats = append $formats "csv" }}{{- end }}
{{- if .Values.searxng.searchFormats.rss }}{{- $formats = append $formats "rss" }}{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
stringData:
  SEARXNG_SECRET: {{ .Values.searxng.secret | quote }}
  {{- if .Values.searxng.settingsYml }}
  settings.yml: |
{{ .Values.searxng.settingsYml | indent 4 }}
  {{- else if $formatsExtra }}
  # Rendered from searxng.searchFormats. search.formats replaces the
  # built-in [html] default (there is no env var for it), so html is always
  # listed first.
  settings.yml: |
    use_default_settings: true

    server:
      image_proxy: true

    search:
      formats:
{{ $formats | toYaml | indent 8 }}
  {{- end }}
{{- end }}
