{{- if .Values.runners.enabled -}}
{{- $fullName := include "n8n.fullname" . -}}
{{- $secretName := printf "%s-config" $fullName -}}
{{- if eq .Values.secretSource "existing" }}{{- $secretName = .Values.existingSecret -}}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-runners
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: runners
spec:
  replicas: {{ .Values.runners.replicaCount }}
  selector:
    matchLabels:
      # Must not match the n8n deployment's pods: the Service and the
      # Deployment of n8n select on name+instance, and a runners pod with
      # those labels would receive traffic meant for n8n (and show up under
      # both deployments).
      app.kubernetes.io/name: {{ include "n8n.name" . }}-runners
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        helm.sh/chart: {{ include "n8n.chart" . }}
        app.kubernetes.io/name: {{ include "n8n.name" . }}-runners
        app.kubernetes.io/part-of: {{ include "n8n.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: runners
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- end }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: runners
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The runners image version must match the n8n version exactly.
          image: "{{ .Values.runners.image.repository }}:{{ .Values.runners.image.tag | default .Values.image.n8n.tag }}"
          imagePullPolicy: {{ .Values.runners.image.pullPolicy }}

          ports:
            - name: launcher
              containerPort: 5680
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: launcher
            initialDelaySeconds: 10
            periodSeconds: 10

          env:
            # The task broker lives in the n8n container on port 5679.
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: {{ printf "http://%s-cip:5679" $fullName | quote }}
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
              value: {{ .Values.runners.autoShutdownTimeout | toString | quote }}
            {{- if .Values.runners.nativePythonRunner }}
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            {{- end }}
            {{- if (include "n8n.runnersLauncherConfig" .) }}
            # Point the launcher at our config. The image's own
            # /etc/n8n-task-runners.json is left untouched.
            - name: N8N_RUNNERS_CONFIG_PATH
              value: "/etc/n8n-task-runners/n8n-task-runners.json"
            {{- end }}

          resources:
            {{- toYaml .Values.runners.resources | nindent 12 }}

          {{- if (include "n8n.runnersLauncherConfig" .) }}
          volumeMounts:
            - name: vol-runners-config
              mountPath: /etc/n8n-task-runners
              readOnly: true
          {{- end }}

      {{- if (include "n8n.runnersLauncherConfig" .) }}
      volumes:
        - name: vol-runners-config
          configMap:
            name: {{ $fullName }}-runners-configs
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
