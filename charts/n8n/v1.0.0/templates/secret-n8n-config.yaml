{{- if eq .Values.secretSource "create" -}}
{{- $fullName := include "n8n.fullname" . -}}
{{- if and .Values.runners.enabled (not .Values.runners.authToken) }}
{{- fail "Runners Auth Token is required when Runners are enabled and Credentials Source is 'Enter values here'" }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
stringData:
  {{- if .Values.runners.authToken }}
  N8N_RUNNERS_AUTH_TOKEN: {{ .Values.runners.authToken | quote }}
  {{- end }}
{{- end }}
