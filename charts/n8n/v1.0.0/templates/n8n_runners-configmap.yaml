{{- if and .Values.runners.enabled (include "n8n.runnersLauncherConfig" .) -}}
{{- $fullName := include "n8n.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-runners-configs
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
data:
  n8n-task-runners.json: {{ include "n8n.runnersLauncherConfig" . | quote }}
{{- end }}
