{{- $fullName := include "n8n.fullname" . -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-cip
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: webui
      port: {{ .Values.service.port }}
      targetPort: 5678
      protocol: TCP
    {{- if .Values.runners.enabled }}
    # Task broker: the runners container connects to it (cluster internal only).
    - name: broker
      port: 5679
      targetPort: 5679
      protocol: TCP
    {{- end }}
  selector:
    {{- include "n8n.selectorLabels" . | nindent 4 }}
