{{- $fullName := include "n8n.fullname" . -}}
{{- $secretName := printf "%s-config" $fullName -}}
{{- if eq .Values.secretSource "existing" }}{{- $secretName = .Values.existingSecret -}}{{- end }}
{{- $nfs := and .Values.storage.nfs.hostname .Values.storage.nfs.path -}}
{{- $scheme := "http" -}}
{{- $publicHost := "" -}}
{{- if .Values.ingress.enabled -}}
{{- if and (or (eq .Values.ingress.exposure "external") (eq .Values.ingress.exposure "both")) .Values.ingress.hostUrl -}}
{{- $publicHost = .Values.ingress.hostUrl -}}
{{- if and .Values.ingress.tlsEnabled .Values.ingress.issuer -}}{{- $scheme = "https" -}}{{- end -}}
{{- else -}}
{{- $publicHost = .Values.ingress.internalHostUrl -}}
{{- end -}}
{{- end -}}
{{- $editorBaseUrl := .Values.envVars.n8n.editorBaseUrl -}}
{{- if and (not $editorBaseUrl) $publicHost -}}
{{- $editorBaseUrl = printf "%s://%s%s" $scheme $publicHost .Values.ingress.hostPath -}}
{{- end -}}
{{- $webhookUrl := .Values.envVars.n8n.webhookUrl -}}
{{- if and (not $webhookUrl) $publicHost -}}
{{- $webhookUrl = printf "%s://%s/" $scheme $publicHost -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  replicas: 1 
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "n8n.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:

      {{- if $nfs }}
      # Creates the release directories on the NFS share and fixes their
      # permissions, so the subPath mounts in the main container can start.
      initContainers:
        - name: prepare-nfs-dirs
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /scripts/init.sh /scripts-w/init.sh && chmod +x /scripts-w/init.sh && /bin/sh /scripts-w/init.sh '{{ $fullName }}'
          volumeMounts:
            - name: vol-{{ $fullName }}-nfs
              mountPath: /tmp_mount
            - name: vol-configs
              mountPath: /scripts/init.sh
              subPath: init.sh
              readOnly: false
            - name: vol-empty-tmp
              mountPath: /scripts-w
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.n8n.repository }}:{{ .Values.image.n8n.tag }}"
          imagePullPolicy: {{ .Values.image.n8n.pullPolicy }}

          ports:
            - name: webui
              containerPort: 5678
              protocol: TCP
            {{- if .Values.runners.enabled }}
            - name: broker
              containerPort: 5679
              protocol: TCP
            {{- end }}

          env:
            # DB VARIABLES
            - name: DB_TYPE
              value: "{{ .Values.envVars.n8n.dbType }}"
            {{- if eq .Values.envVars.n8n.dbType "postgresdb" }}
            - name: DB_POSTGRESDB_HOST
              value: "{{ .Values.envVars.n8n.dbHost }}"
            - name: DB_POSTGRESDB_PORT
              value: "{{ .Values.envVars.n8n.dbPort }}"
            - name: DB_POSTGRESDB_DATABASE
              value: "{{ .Values.envVars.n8n.dbName }}"
            - name: DB_POSTGRESDB_USER
              value: "{{ .Values.envVars.n8n.dbUser }}"
            - name: DB_POSTGRESDB_PASSWORD
              value: "{{ .Values.envVars.n8n.dbPass }}"
            {{- end }}

            # EMAIL VARS
            {{- if .Values.envVars.n8n.configureMail }}
            - name: N8N_EMAIL_MODE
              value: "{{ .Values.envVars.n8n.emailMode }}"
            {{- end }}

            {{- if and .Values.envVars.n8n.configureMail (eq .Values.envVars.n8n.emailMode "smtp") }}
            - name: N8N_SMTP_HOST
              value: "{{ .Values.envVars.n8n.smtpHost }}"
            - name: N8N_SMTP_PORT
              value: "{{ .Values.envVars.n8n.smtpPort }}"
            - name: N8N_SMTP_SENDER
              value: "{{ .Values.envVars.n8n.smtpSender }}"
            - name: N8N_SMTP_SSL
              value: "{{ .Values.envVars.n8n.smtpSsl }}"
            {{- end }}

            # LOG VARS
            - name: N8N_LOG_LEVEL
              value: "{{ .Values.envVars.n8n.logLevel }}"
            - name: TZ
              value: {{ .Values.envVars.n8n.timezone | quote }}
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: {{ .Values.envVars.n8n.nodeFunctionAllowBuiltin | quote }}
            - name: NODES_EXCLUDE
              value: {{ .Values.envVars.n8n.nodesExclude | quote }}
            - name: DB_SQLITE_POOL_SIZE
              value: {{ .Values.envVars.n8n.sqlitePoolSize | toString | quote }}
            - name: N8N_RESTRICT_FILE_ACCESS_TO
              value: {{ .Values.envVars.n8n.restrictFileAccessTo | quote }}
            - name: N8N_SKIP_AUTH_ON_OAUTH_CALLBACK
              value: {{ .Values.envVars.n8n.skipAuthOnOauthCallback | toString | quote }}
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: {{ .Values.envVars.n8n.enforceSettingsFilePermissions | toString | quote }}

            # TASK RUNNERS
            # The runners container connects to the broker that runs here.
            {{- if .Values.runners.enabled }}
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: N8N_RUNNERS_AUTH_TOKEN
            {{- end }}

            # PUBLIC URL
            # n8n hands these URLs back to the browser (chat trigger, webhook
            # widget). Without them it falls back to localhost and the chat
            # widget fails with "Failed to receive response".
            {{- if $editorBaseUrl }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ $editorBaseUrl | quote }}
            {{- end }}
            {{- if $webhookUrl }}
            # N8N_WEBHOOK_URL replaced WEBHOOK_URL in n8n 2.35.0 (the old name
            # still works but logs a deprecation warning).
            - name: N8N_WEBHOOK_URL
              value: {{ $webhookUrl | quote }}
            {{- end }}
            {{- if $publicHost }}
            - name: N8N_HOST
              value: {{ $publicHost | quote }}
            - name: N8N_PROTOCOL
              value: {{ $scheme | quote }}
            - name: N8N_PORT
              value: {{ ternary "443" "80" (eq $scheme "https") | quote }}
            {{- end }}
            # Number of reverse proxies in front of n8n. Without this, Express
            # does not trust the X-Forwarded-For header that Traefik sends and
            # the rate limiter cannot identify the clients.
            - name: N8N_PROXY_HOPS
              value: {{ .Values.envVars.n8n.proxyHops | toString | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if $nfs }}
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: vol-{{ $fullName }}-nfs
              subPath: {{ $fullName }}/n8n_data
            - mountPath: /files
              name: vol-{{ $fullName }}-nfs
              subPath: {{ $fullName }}/files
            - mountPath: /backups
              name: vol-{{ $fullName }}-nfs
              subPath: {{ $fullName }}/backups
            - mountPath: /secrets
              name: vol-{{ $fullName }}-nfs
              subPath: {{ $fullName }}/secrets
          {{- end }}

      {{- if $nfs }}
      volumes:
        - name: vol-{{ $fullName }}-nfs
          nfs:
            server: {{ .Values.storage.nfs.hostname }}
            path: {{ .Values.storage.nfs.path }}
        - name: vol-configs
          configMap:
            name: {{ $fullName }}-configs
        - name: vol-empty-tmp
          emptyDir: {}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
