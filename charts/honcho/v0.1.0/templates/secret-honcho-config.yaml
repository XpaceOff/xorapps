{{- if eq .Values.secretSource "create" -}}
{{- $fullName := include "honcho.fullname" . -}}
{{- $internal := eq .Values.database.type "internal" -}}
{{- $haveLlmKey := or .Values.envVars.honcho.openaiApiKey .Values.envVars.honcho.anthropicApiKey .Values.envVars.honcho.geminiApiKey -}}
{{- if not $haveLlmKey }}{{ fail "An LLM API key is required (LLM OpenAI/Anthropic/Gemini). Honcho refuses to start without a model provider." }}{{- end }}
{{- if and $internal (not .Values.database.internal.password) }}{{ fail "Postgres Password is required when Database is 'Deploy my own Postgres'" }}{{- end }}
{{- if and $internal (not (regexMatch "^[A-Za-z0-9._~-]+$" .Values.database.internal.password)) }}{{ fail "Postgres Password may only contain letters, digits, '.', '_', '~' and '-' when Database is 'Deploy my own Postgres' (it is put into the connection URI unescaped)" }}{{- end }}
{{- if and .Values.auth.enabled (not .Values.envVars.honcho.jwtSecret) }}{{ fail "JWT Secret is required when Authentication is enabled" }}{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
stringData:
  {{- if not $internal }}
  DB_CONNECTION_URI: {{ include "honcho.externalDbUri" . | quote }}
  {{- end }}
  {{- if .Values.envVars.honcho.openaiApiKey }}
  LLM_OPENAI_API_KEY: {{ .Values.envVars.honcho.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.envVars.honcho.anthropicApiKey }}
  LLM_ANTHROPIC_API_KEY: {{ .Values.envVars.honcho.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.envVars.honcho.geminiApiKey }}
  LLM_GEMINI_API_KEY: {{ .Values.envVars.honcho.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.envVars.honcho.baseUrl }}
  LLM_OPENAI_BASE_URL: {{ .Values.envVars.honcho.baseUrl | quote }}
  {{- end }}
  {{- if .Values.envVars.honcho.jwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.envVars.honcho.jwtSecret | quote }}
  {{- end }}
  {{- if $internal }}
  POSTGRES_PASSWORD: {{ .Values.database.internal.password | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
{{- end }}
