{{- if eq .Values.database.type "internal" }}
{{- $fullName := include "honcho.fullname" . -}}
# Only the Honcho pods in this release may connect to the internal Postgres.
# Without this, every pod in the cluster can reach the database on port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-db-np
  labels:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "honcho.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The API and the deriver. Both carry app.kubernetes.io/instance=<release>.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
