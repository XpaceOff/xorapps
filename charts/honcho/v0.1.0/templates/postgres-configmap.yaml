{{- if eq .Values.database.type "internal" }}
{{- $fullName := include "honcho.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-db-init
  labels:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "honcho.name" . }}
data:
  init.sql: |
    -- Honcho needs the pgvector extension; pg_trgm and btree_gin are optional
    -- (without them the message search indexes are skipped).
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
{{- end }}
