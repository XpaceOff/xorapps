{{- if eq .Values.database.type "internal" }}
{{- $fullName := include "honcho.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-db-cip
  labels:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "honcho.name" . }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.database.internal.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $fullName }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
