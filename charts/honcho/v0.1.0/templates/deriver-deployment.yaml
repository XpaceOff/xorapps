{{- if .Values.deriver.enabled }}
{{- $fullName := include "honcho.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-deriver
  labels:
    app.kubernetes.io/name: {{ $fullName }}-deriver
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "honcho.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.deriver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}-deriver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ $fullName }}-deriver
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ include "honcho.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if or .Values.migrations.enabled .Values.redis.enabled }}
      initContainers:
        {{- include "honcho.waitForCacheInitContainer" . | nindent 8 }}
        {{- if .Values.migrations.enabled }}
        {{- include "honcho.migrateInitContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: deriver
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The deriver is a Python module, not the API server.
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]

          env:
            {{- include "honcho.env" . | nindent 12 }}
            - name: DERIVER_ENABLED
              value: "true"
            - name: DERIVER_WORKERS
              value: {{ .Values.deriver.workers | toString | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
